[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "disaster-ai-audit"
version = "0.1.0"
description = "Beyond the Random Split: Event-Held-Out and Compound-Shift Evaluation of Multimodal Disaster AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Disaster AI Audit Team"},
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "open_clip_torch>=2.24.0",
    "sentence-transformers>=2.3.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "cleanlab>=2.5.0",
    "imagehash>=4.3.0",
    "scipy>=1.11.0",
    "datasets>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
